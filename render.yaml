# Render Blueprint — free web + Neon Postgres (avoids legacy "starter" DB plan)
# Branch: main
# Deploy: https://render.com/deploy?repo=https://github.com/neerajdeepak1815-del/ai-investment-analyst
#
# When prompted for NEON_DATABASE_URL:
#   1. Create free DB at https://neon.tech
#   2. Paste the Neon connection string

services:
  - type: web
    name: meridian-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_USERNAME
        value: "admin"
      - key: AUTH_PASSWORD
        value: "MeridianStart99"
      - key: SEC_USER_AGENT
        value: "MERIDIAN/1.0 meridian-deploy@example.com"
      - key: AUTO_REFRESH_ENABLED
        value: "true"
      - key: AUTO_REFRESH_INTERVAL_MINUTES
        value: "15"
      - key: FINNHUB_API_KEY
        value: ""

# Render Blueprint — one-click Meridian deploy
# Open: https://render.com/deploy?repo=https://github.com/neerajdeepak1815-del/ai-investment-analyst
# Or: Dashboard → New + → Blueprint → connect this repo (branch main).

services:
  - type: web
    name: meridian-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_USERNAME
        value: "admin"
      # Change after first login (Environment → AUTH_PASSWORD)
      - key: AUTH_PASSWORD
        value: "MeridianStart99"
      # Replace with your real email after deploy (SEC requires a contact address)
      - key: SEC_USER_AGENT
        value: "MERIDIAN/1.0 meridian-deploy@example.com"
      - key: AUTO_REFRESH_ENABLED
        value: "true"
      - key: AUTO_REFRESH_INTERVAL_MINUTES
        value: "15"
      # Optional: add later for reliable cloud quotes — https://finnhub.io/register
      - key: FINNHUB_API_KEY
        value: ""

databases:
  - name: meridian-db
    plan: starter
